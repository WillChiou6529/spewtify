name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SPEWTIFY_VERSION: 1.0.${{ github.run_number }}
      SPEWTIFY_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Chaquopy 需要同版本的主機 Python 來裝 yt-dlp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # repo 內的 gradle wrapper 與 gradlew 腳本不相容（上游用 Nix 提供 Gradle），直接裝指定版本
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.SPEWTIFY_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/spewtify.p12"
          echo "SPEWTIFY_KEYSTORE=$RUNNER_TEMP/spewtify.p12" >> "$GITHUB_ENV"
          echo "SPEWTIFY_KEY_ALIAS=spewtify" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SPEWTIFY_KEYSTORE_PASSWORD: ${{ secrets.SPEWTIFY_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect and verify APK
        run: |
          apk=$(find app/build/outputs/apk/release -name '*arm64-v8a*.apk' | head -1)
          test -n "$apk"
          cp "$apk" Spewtify.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs Spewtify.apk | head -3
          "$bt/aapt2" dump badging Spewtify.apk | grep -E "^package|application-label:" | head -2
          ls -l Spewtify.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$SPEWTIFY_VERSION" Spewtify.apk \
            --title "Spewtify $SPEWTIFY_VERSION" \
            --notes "自動建置：${GITHUB_SHA::7}。手機下載：https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Spewtify.apk" \
            --latest
